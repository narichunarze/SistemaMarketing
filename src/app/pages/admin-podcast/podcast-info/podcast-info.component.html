<body>
    <div class="container mt-5">
        <h2>Solicitud de Podcast</h2>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <style>
            .confirmation-message {
                background-color: #f8f9fa;
                border-left: 5px solid #007bff;
                padding: 20px;
                margin: 20px 0;
                border-radius: 5px;
            }

            .confirmation-message h4 {
                margin-bottom: 10px;
            }
        </style>
    
            <div class="container mt-5">
                <div class="confirmation-message">
                    <p>Por favor, espera la confirmación por correo electrónico de que el podcast será posible en la
                        fecha que solicitaste.</p>
                    <p>Estamos trabajando para asegurarnos de que tu experiencia sea la mejor posible.</p>
                </div>
            </div>

            <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
            <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
            <form [formGroup]="formGroup" *ngIf="solicitudData">
                <div class="form-group"> 
                    <label for="fechaEntrega">Fecha de Entrega</label> <br>
                    <p-calendar [formControlName]="'fechaEntrega'" showTime="true" [hourFormat]="24"></p-calendar>
                </div>

                <div class="form-group">
                    <label for="cantidad_personas">Cantidad de Personas</label>
                    <input type="number" class="form-control" id="cantidad_personas" name="cantidad_personas" min="1" [formControlName]="'informacion'"
                        required>
                </div>

                <div class="form-group">
                    <label for="tematica">Temática</label>
                    <textarea class="form-control" id="tematica" name="tematica" rows="3" required [formControlName]="'informacionAdicional'"></textarea>
                </div>

            </form>

    </div>

    <div class="col-6  flex justify-content-center">
        <p-toast/>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
