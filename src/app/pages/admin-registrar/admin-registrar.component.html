<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Registro</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(90deg, rgba(4,11,55,1) 0%, rgba(24,50,124,1) 50%, rgba(4,11,55,1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            border-radius: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            max-width: 700px; /* Aumenta el ancho máximo */
            width: 100%;
        }

        .form-control {
            border-radius: 0.5rem;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .text-gray-900 {
            color: #343a40;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #343a40;
        }

        label {
            font-weight: 500;
            color: #343a40;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h1 class="h4 text-gray-900">Crear cuenta</h1>
                </div>
                <form  [formGroup]="formGroup" (ngSubmit)="enviarFormulario()">
                    <div class="form-group">
                        <label for="nombreUsuario">Nombre</label>
                        <input type="text" class="form-control" id="nombreUsuario" placeholder="Nombre" [formControlName]="'name'" required>
                    </div>
                    <div class="form-group">
                        <label for="apellidoUsuario">Apellido</label>
                        <input type="text" class="form-control" id="apellidoUsuario" placeholder="Apellido" [formControlName]="'lastname'" required>
                    </div>
                    <div class="form-group">
                        <label for="emailUsuario">Email Corporativo</label>
                        <input type="email" class="form-control" id="emailUsuario" placeholder="Email Corporativo" [formControlName]="'email'" required>
                    </div>
                    <div class="form-group">
                        <label for="usuarioPassword">Contraseña</label>
                        
                        <input type="password" class="form-control" id="usuarioPassword" placeholder="Contraseña"  [formControlName]="'password'" required>

                        <small id="username-help" class="p-error" *ngIf="formGroup.get('password').invalid && formGroup.get('password').touched">
                            Requerido.
                        </small>
                    </div>
                    <div class="form-group">
                        <label for="usuarioRepetirPassword">Vuelva a escribir su contraseña</label>
                        <input type="password" class="form-control" id="usuarioRepetirPassword" placeholder="Confirmar Contraseña" [formControlName]="'passwordComfir'" required>
                    
                     
                        <small id="username-help" class="p-error" *ngIf="formGroup.value.passwordComfir != formGroup.value.password">
                            Las contraseñas no coinciden.
                        </small>
                    </div>
                    <div class="form-group">
                        <label> Rol </label> <br>
                        <p-dropdown [formControlName]="'idRol'" [id]="'idRol'" [options]="permissions" optionLabel="name" optionValue="code"></p-dropdown>
                    
                        <small id="username-help" class="p-error" *ngIf="formGroup.get('idRol').invalid && formGroup.get('idRol').touched">
                            Requerido.
                        </small>
                    </div>
                    <input pButton type="submit" class="btn btn-primary btn-block" value="Registrar cuenta" [disabled]="!formGroup.valid || formGroup.value.passwordComfir != formGroup.value.password">

                </form>
            </div>
        </div>
    </div>



    <!-- Bootstrap core JavaScript-->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    
</body>

</html>


<div class="col-6  flex justify-content-center">
    <p-toast/>
</div>
