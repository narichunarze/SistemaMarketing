<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Registro</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(90deg, rgba(4,11,55,1) 0%, rgba(24,50,124,1) 50%, rgba(4,11,55,1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            border-radius: 1rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            max-width: 700px; /* Aumenta el ancho máximo */
            width: 100%;
        }

        .form-control {
            border-radius: 0.5rem;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .text-gray-900 {
            color: #343a40;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #343a40;
        }

        label {
            font-weight: 500;
            color: #343a40;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card o-hidden border-0 shadow-lg my-5">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h1 class="h4 text-gray-900">Crear cuenta</h1>
                </div>
                <form>
                    <div class="form-group">
                        <label for="nombreUsuario">Nombre</label>
                        <input type="text" class="form-control" id="nombreUsuario" placeholder="Nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="apellidoUsuario">Apellido</label>
                        <input type="text" class="form-control" id="apellidoUsuario" placeholder="Apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="emailUsuario">Email Corporativo</label>
                        <input type="email" class="form-control" id="emailUsuario" placeholder="Email Corporativo" required>
                    </div>
                    <div class="form-group">
                        <label for="usuarioPassword">Contraseña</label>
                        <input type="password" class="form-control" id="usuarioPassword" placeholder="Contraseña" required>
                    </div>
                    <div class="form-group">
                        <label for="usuarioRepetirPassword">Vuelva a escribir su contraseña</label>
                        <input type="password" class="form-control" id="usuarioRepetirPassword" placeholder="Confirmar Contraseña" required>
                    </div>
                    <div class="form-group">
                        <label for="rolUsuario">Rol</label>
                        <select class="form-control" id="rolUsuario" required>
                            <option value="" disabled selected>Seleccione su rol</option>
                            <option value="usuario">Usuario</option>
                            <option value="administrador">Administrador</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Registrar Cuenta</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap core JavaScript-->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
</body>

</html>
