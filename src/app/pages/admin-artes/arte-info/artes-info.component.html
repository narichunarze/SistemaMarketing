<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Artes</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <style>
        .section-divider {
            background-color: #CED9EE; 
            padding: 20px; 
            margin-top: 20px; 
            border-radius: 5px; 
        }
        .section-title {
            font-weight: bold; 
            margin-bottom: 15px; 
        }
    </style>
</head>
<body>
    <div class="container mt-5" *ngIf="!!this.solicitudData">
        <h2>Solicitud de Artes</h2>
        <form [formGroup]="formGroup">
            <div class="form-group">
                <label for="tipoSolicitud">Tipo de Solicitud</label>
                <select class="form-control" id="tipoSolicitud" name="tipoSolicitud" [formControlName]="'tipoSolicitud'" required>
                    <option value="interno">Interno</option>
                    <option value="externo">Externo</option>
                </select>
            </div>

            <div class="form-group">
                <div class="p-fluid p-formgrid grid">
                    <div class="field col-12 md:col-12">
                        <label for="fechaEntrega">Fecha de Entrega</label>
                           <p-calendar [formControlName]="'fechaEntrega'"  required></p-calendar>
                    </div>
                </div>
        </div>

            <div class="form-group">
                <label for="area">Área</label>
                <select class="form-control" id="area" name="area"  [formControlName]="'area'" required>
                    <option value="admisiones">Admisiones</option>
                    <option value="bienestar_estudiantil">Bienestar Estudiantil</option>
                    <option value="postgrado">Postgrado</option>
                    <option value="academico">Académico</option>
                    <option value="vicerrectorado">Vicerrectorado</option>
                </select>
            </div>

            <div class="form-group">
                <label for="titulo">Título</label>
                <input type="text" class="form-control" name="titulo[]" required [formControlName]="'titulo'" >
            </div>

            <!-- Nueva sección con color de fondo específico -->
            <div class="section-divider">
                <div class="section-title">Detalles del Arte</div> <!-- Título para la nueva sección -->
                
                <div class="form-group">
                <div class="p-fluid p-formgrid grid">
                    <div class="field col-12 md:col-12">
                        <label for="fechasTentativasString">Fecha y hora</label>
                           <p-calendar  [formControlName]="'fechasTentativasString'" showTime="true" [hourFormat]="24"></p-calendar>
                    </div>
                </div>

                <div class="form-group">
                    <label for="ubicacion">Ubicación</label>
                    <input type="text" class="form-control" name="ubicacion[]" required [formControlName]="'ubicacion'" >
                </div>

                <div class="form-group">
                    <label for="tipoPost">Tipo de Post</label>
                    <select class="form-control" id="tipoPost" name="tipoPost" [formControlName]="'tipoPost'" required>
                        <option value="historia">Historia</option>
                        <option value="post">Post</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="comentarios">Comentarios</label>
                    <textarea
                      class="form-control"
                      id="comentarios"
                      rows="3"
                      formControlName="informacionAdicional"
                    ></textarea>
                  </div>
                  
            </div>
            </div>

        </form>
    </div>

    <div class="col-6  flex justify-content-center">
        <p-toast/>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
